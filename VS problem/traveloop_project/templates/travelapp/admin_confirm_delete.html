{% extends 'base.html' %}
{% block title %}Delete {{ item_type|capfirst }}{% endblock %}

{% block content %}
<div class="glass-card" style="padding: 2rem; max-width: 640px; margin: 3rem auto; text-align: center;">
    <h1 style="margin-bottom: 1rem;">Delete {{ item_type|capfirst }}</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Are you sure you want to permanently delete &ldquo;{{ object_name }}&rdquo;?</p>
    <form method="post" style="display: inline-flex; gap: 1rem;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url cancel_url %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
