{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="glass-card" style="padding: 2rem; max-width: 720px; margin: 2rem auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="margin: 0;">{{ page_title }}</h1>
            <p style="color: var(--text-secondary);">Use JSON for activities, e.g. {"Beach":"Relax on the coast"}.</p>
        </div>
        <a href="{% url 'admin_city_list' %}" class="btn btn-secondary">Back to Cities</a>
    </div>

    <form method="post" style="display: grid; gap: 1rem;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save City</button>
    </form>
</div>
{% endblock %}
